name: IAM Drift Detector CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile source
        run: python -m compileall -q .

      - name: Test deterministic analysis
        run: python -m pytest -q

      - name: Verify CLI and reporting imports
        run: |
          python -c "from main import build_parser; from report import ScanReport; from scanner import IAMScanner; print('CLI and report imports OK')"
          python main.py --help
